<!doctype html>
<html lang="en">

    <title>FitMon · Check your bicep curl form with any webcam</title>
    <meta name="description" content="FitMon watches your bicep curls through your webcam, scores every rep out of 100 and cues you when your elbow drifts or you rush the lowering. Runs in your browser; your video never leaves your computer." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitMon" />
    <meta property="og:title" content="FitMon · Check your bicep curl form with any webcam" />
    <meta property="og:description" content="Every curl scored out of 100, with live cues when your elbow drifts or you rush the lowering. Runs in your browser." />

    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" />
    <script>
      // Runs before first paint so a saved dark theme never flashes light.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('fitmon-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#000000' : '#eceeed');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
